name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Fetch face-embedding model
        run: |
          set -e
          mkdir -p app/src/main/assets
          OUT=app/src/main/assets/mobile_face_net.tflite
          valid() { [ -f "$1" ] && [ "$(wc -c < "$1")" -gt 1000000 ] \
            && [ "$(dd if="$1" bs=1 skip=4 count=4 2>/dev/null)" = "TFL3" ]; }

          ok=0
          # Primary: real MobileFaceNet (112x112 -> 192) shipped inside the
          # offline_face_recognition pub.dev package.
          echo "Fetching MobileFaceNet from pub.dev..."
          if curl -fsSL "https://pub.dev/api/archives/offline_face_recognition-0.1.1.tar.gz" -o pkg.tgz; then
            mkdir -p pkg && tar xzf pkg.tgz -C pkg || true
            f="$(find pkg -iname '*.tflite' -size +1M | head -n1)"
            if [ -n "$f" ]; then cp "$f" "$OUT"; fi
            valid "$OUT" && { echo "Got MobileFaceNet ($(wc -c < "$OUT") bytes)"; ok=1; }
          fi

          if [ "$ok" -ne 1 ]; then
            echo "::warning::MobileFaceNet unavailable; falling back to Google MobileNetV3 embedder (weaker identity separation)."
            curl -fsSL "https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite" -o "$OUT"
          fi

          ls -la "$OUT"
          valid "$OUT" || { echo "No valid TFLite model"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: faceunlock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
